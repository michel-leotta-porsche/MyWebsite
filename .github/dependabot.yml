# Dependabot: meldet unsichere Pakete und schlägt Updates als PR vor.
# Kleine Updates (minor/patch) kommen gebündelt einmal pro Woche, große (major) einzeln, damit man sie bewusst prüft.
# Jeder Dependabot-PR läuft durch „Prüfen“ und bekommt einen Vorschau-Link, bevor er gemergt wird.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/photos", "/photos/functions"]
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    groups:
      klein:
        update-types: [minor, patch]
    commit-message:
      prefix: "Pakete"
    ignore:
      # Typen passend zur Node-Version, mit der gebaut und ausgespielt wird (22). Erst mit dem Umstieg auf Node 24 anheben.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # typescript-eslint (über eslint-config-next) läuft noch nicht mit TypeScript 7. Freigeben, sobald Next es unterstützt.
      - dependency-name: typescript
        versions: [">=7"]
      # eslint-plugin-react (über eslint-config-next) bricht mit ESLint 10. Freigeben, sobald eslint-config-next ESLint 10 nennt.
      - dependency-name: eslint
        versions: [">=10"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Actions"
