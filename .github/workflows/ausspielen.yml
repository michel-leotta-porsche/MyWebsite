# Spielt die Foto-App (Calima) auf Firebase Hosting aus, Projekt fujiventura, nur das Ziel app (Site calima).
# Live nur von Hand: unter Actions → Ausspielen → „Run workflow“ (Hauptzweig). Bei jedem PR: eigener Vorschau-Link (7 Tage), den der PR als Kommentar bekommt.
# Den Export baut der predeploy in firebase.json selbst (npm run export, danach check-export).
#
# Braucht zwei Repository-Secrets:
#   FIREBASE_SERVICE_ACCOUNT_FUJIVENTURA  Dienstkonto-JSON (legt `firebase init hosting:github` an)
#   FUJI_IMPRESSUM_ADRESSE                Anschrift fürs Impressum, Zeilen mit | getrennt (wie in .env.local)
name: Ausspielen

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", ".github/dependabot.yml", ".github/workflows/codeql.yml", ".github/workflows/pruefen.yml"]
  # Knopf „Run workflow“ unter Actions: spielt den Hauptstand live aus
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  live:
    name: Live auf calima
    # nur der Hauptstand (Standard-Branch des Repos) geht live, auch wenn beim Knopf ein anderer Branch gewählt ist
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # nie zwei Deploys gleichzeitig, und keiner wird mittendrin abgebrochen
    concurrency:
      group: ausspielen-live
      cancel-in-progress: false
    env:
      FUJI_IMPRESSUM_ADRESSE: ${{ secrets.FUJI_IMPRESSUM_ADRESSE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUJIVENTURA }}
          projectId: fujiventura
          target: app
          channelId: live

  vorschau:
    name: Vorschau-Link
    # Secrets gibt es nur für PRs aus diesem Repo, nicht aus Forks.
    # Dependabot-PRs bekommen die Actions-Secrets ebenfalls nicht; für sie reicht der Build in „Prüfen“.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: ausspielen-vorschau-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      FUJI_IMPRESSUM_ADRESSE: ${{ secrets.FUJI_IMPRESSUM_ADRESSE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUJIVENTURA }}
          projectId: fujiventura
          target: app
          expires: 7d
