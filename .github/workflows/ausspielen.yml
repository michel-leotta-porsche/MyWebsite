# Spielt die Foto-App (Calima) auf Firebase Hosting aus, Projekt fujiventura, nur das Ziel app (Site calima).
# Live nur von Hand: unter Actions → Ausspielen → „Run workflow“ (Branch claude/project-thread-d5e0a0). Bei jedem PR: eigener Vorschau-Link (7 Tage), den der PR als Kommentar bekommt.
# Den Export baut der predeploy in photos/firebase.json selbst (npm run export, danach check-export).
#
# Braucht zwei Repository-Secrets:
#   FIREBASE_SERVICE_ACCOUNT_FUJIVENTURA  Dienstkonto-JSON (legt `firebase init hosting:github` an)
#   FUJI_IMPRESSUM_ADRESSE                Anschrift fürs Impressum, Zeilen mit | getrennt (wie in photos/.env.local)
name: Ausspielen

on:
  pull_request:
    paths: ["photos/**", ".github/workflows/ausspielen.yml"]
  # Knopf „Run workflow“ unter Actions: spielt den Hauptstand live aus
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  live:
    name: Live auf calima
    # nur der Hauptstand geht live, auch wenn beim Knopf ein anderer Branch gewählt ist
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/project-thread-d5e0a0'
    runs-on: ubuntu-latest
    # nie zwei Deploys gleichzeitig, und keiner wird mittendrin abgebrochen
    concurrency:
      group: ausspielen-live
      cancel-in-progress: false
    env:
      FUJI_IMPRESSUM_ADRESSE: ${{ secrets.FUJI_IMPRESSUM_ADRESSE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: photos/package-lock.json
      - run: npm ci
        working-directory: photos
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUJIVENTURA }}
          projectId: fujiventura
          target: app
          channelId: live
          entryPoint: photos

  vorschau:
    name: Vorschau-Link
    # Secrets gibt es nur für PRs aus diesem Repo, nicht aus Forks.
    # Dependabot-PRs bekommen die Actions-Secrets ebenfalls nicht; für sie reicht der Build in „Prüfen“.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: ausspielen-vorschau-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      FUJI_IMPRESSUM_ADRESSE: ${{ secrets.FUJI_IMPRESSUM_ADRESSE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: photos/package-lock.json
      - run: npm ci
        working-directory: photos
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FUJIVENTURA }}
          projectId: fujiventura
          target: app
          expires: 7d
          entryPoint: photos
