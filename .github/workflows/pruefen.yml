# Prüft jeden PR und jeden Merge: Lint, Typen und Build für die Website (Wurzel) und die Foto-App (photos/).
# Dasselbe, was AGENTS.md vor jedem Push verlangt, nur jetzt mit Haken am PR.
name: Prüfen

on:
  pull_request:
  push:
    branches: [claude/project-thread-d5e0a0]

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

# nur lesen: dieser Workflow braucht keine Schreibrechte am Repo
permissions:
  contents: read

jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # erst bauen: next build erzeugt die Typen für PageProps und LayoutProps, die tsc braucht
      - run: npm run build
      - run: npx tsc --noEmit

  photos:
    name: Foto-App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: photos/package-lock.json
      - run: npm ci
      - run: npm run lint
      # erst bauen: next build legt next-env.d.ts an (Typen für Bild-Importe), das nicht im Repo liegt
      - run: npm run build
      - run: npx tsc --noEmit

  pakete:
    name: Neue Pakete
    # vergleicht die Lockfiles mit dem Hauptstand: rot, wenn der PR ein Paket mit bekannter Lücke (hoch oder kritisch) hinzufügt.
    # Bestehende Funde blockieren nicht, die meldet Dependabot.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
