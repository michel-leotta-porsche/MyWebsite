# Prüft jeden PR und jeden Merge: Lint, Typen und Build für Calima.
# Dasselbe, was AGENTS.md vor jedem Push verlangt, nur jetzt mit Haken am PR.
name: Prüfen

on:
  pull_request:
  push:
    # beide Namen, damit nach dem Umbenennen des Hauptzweigs nichts ausfällt
    branches: [main, claude/project-thread-d5e0a0]

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

# nur lesen: dieser Workflow braucht keine Schreibrechte am Repo
permissions:
  contents: read

jobs:
  photos:
    name: Foto-App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # erst bauen: next build legt next-env.d.ts an (Typen für Bild-Importe), das nicht im Repo liegt
      - run: npm run build
      - run: npx tsc --noEmit

  pakete:
    name: Neue Pakete
    # vergleicht die Lockfiles mit dem Hauptstand: rot, wenn der PR ein Paket mit bekannter Lücke (hoch oder kritisch) hinzufügt.
    # Bestehende Funde blockieren nicht, die meldet Dependabot.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
      - run: npm test
